# Server
spring.application.name=order-management-api
server.port=9090

# Database (uses env vars, falls back to safe defaults)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/orders}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/docs/openapi
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.orderapi=INFO
logging.level.org.springframework.web=WARN